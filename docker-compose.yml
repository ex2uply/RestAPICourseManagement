version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: course-management-db
    environment:
      POSTGRES_DB: course_management
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - course-management-network

  app:
    build: .
    container_name: course-management-api
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/course_management
      DB_USERNAME: postgres
      DB_PASSWORD: password
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: admin123
      JWT_SECRET: mySecretKey
      DDL_AUTO: update
      SHOW_SQL: false
    ports:
      - "8081:8081"
    depends_on:
      - postgres
    networks:
      - course-management-network

volumes:
  postgres_data:

networks:
  course-management-network:
    driver: bridge
